<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle for iOS & PWA -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />

  <!-- Outer Vinyl Groove -->
  <circle cx="256" cy="256" r="170" fill="#0f172a" stroke="#1e293b" stroke-width="12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#334155" stroke-width="2" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="#475569" stroke-width="1.5" />

  <!-- Center Record Label -->
  <circle cx="256" cy="256" r="64" fill="url(#glow)" />
  <circle cx="256" cy="256" r="22" fill="#020617" />
  <circle cx="256" cy="256" r="10" fill="#38bdf8" />

  <!-- Stylized Play & Audio Waves Indicator -->
  <path d="M 244 240 L 274 256 L 244 272 Z" fill="#ffffff" />

  <!-- iPad frame corner ticks -->
  <rect x="64" y="64" width="384" height="384" rx="36" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3" />
  <circle cx="256" cy="424" r="8" fill="#38bdf8" fill-opacity="0.6" />
  <rect x="236" y="80" width="40" height="4" rx="2" fill="#38bdf8" fill-opacity="0.4" />
</svg>
